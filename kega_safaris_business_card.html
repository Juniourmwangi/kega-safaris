<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kega Safaris – Business Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 44px;
      background: #1a1a1a;
      font-family: 'Lato', sans-serif;
      padding: 48px 24px;
    }

    h2 {
      color: #666;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-family: 'Lato', sans-serif;
      font-weight: 300;
    }

    .cards-wrap {
      display: flex;
      flex-direction: column;
      gap: 36px;
      align-items: center;
    }

    .card {
      width: 3.5in;
      height: 2in;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06);
      transition: transform 0.4s cubic-bezier(.22,1,.36,1), box-shadow 0.4s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-7px) rotate(-0.4deg);
      box-shadow: 0 45px 90px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.1);
    }

    /* ══════════════ FRONT ══════════════ */
    .card-front {
      width: 100%; height: 100%;
      background: linear-gradient(160deg, #0a2a0a 0%, #0f3d0f 45%, #0a2a0a 100%);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0;
      position: relative;
      overflow: hidden;
    }

    /* Safari landscape silhouette background */
    .card-front::before {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 55px;
      background: rgba(0,0,0,0.18);
      clip-path: polygon(0% 100%, 0% 60%, 5% 55%, 10% 58%, 15% 40%, 20% 35%, 22% 38%, 25% 20%, 28% 15%, 32% 20%, 35% 18%, 38% 12%, 40% 10%, 43% 14%, 46% 8%, 50% 5%, 53% 9%, 57% 12%, 60% 18%, 63% 15%, 66% 20%, 70% 25%, 73% 22%, 76% 30%, 80% 35%, 83% 40%, 86% 55%, 90% 52%, 94% 58%, 100% 55%, 100% 100%);
    }

    /* Gold top border */
    .front-top-bar {
      height: 4px;
      background: linear-gradient(90deg, #d4aa40, #f5d060, #d4aa40);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    /* Sun glow */
    .sun-glow {
      position: absolute;
      top: -30px; right: -30px;
      width: 120px; height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(245,208,96,0.18) 0%, transparent 70%);
      pointer-events: none;
    }

    .front-body {
      flex: 1;
      display: grid;
      grid-template-columns: auto 1px 1fr;
      align-items: stretch;
      padding: 0 20px;
      gap: 0;
      position: relative;
      z-index: 1;
    }

    /* Left: Logo */
    .front-logo-col {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 16px 12px 0;
    }
    .front-logo-col img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 6px;
      filter: drop-shadow(0 2px 8px rgba(0,0,0,0.5));
    }

    /* Divider */
    .front-divider {
      background: linear-gradient(180deg, transparent, rgba(212,170,64,0.4), transparent);
      width: 1px;
      align-self: stretch;
    }

    /* Right: Info */
    .front-info-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 12px 0 12px 18px;
      gap: 3px;
    }

    .company-name {
      font-family: 'Cinzel', serif;
      font-size: 18px;
      font-weight: 700;
      color: #f5d060;
      letter-spacing: 0.06em;
      line-height: 1.1;
      text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    }

    .company-sub {
      font-size: 8.5px;
      font-weight: 300;
      color: rgba(245,208,96,0.7);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .person-name {
      font-family: 'Cinzel', serif;
      font-size: 11.5px;
      font-weight: 500;
      color: #ffffff;
      letter-spacing: 0.05em;
    }

    .person-role {
      font-size: 7.5px;
      font-weight: 400;
      color: rgba(255,255,255,0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 1px;
      margin-bottom: 10px;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 3px;
    }
    .contact-row svg { opacity: 0.55; flex-shrink: 0; }
    .contact-row span {
      font-size: 8px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.03em;
    }

    /* Bottom bar */
    .front-bottom-bar {
      height: 3px;
      background: linear-gradient(90deg, #1a6b1a, #2e9e2e, #1a6b1a);
      flex-shrink: 0;
      position: relative;
      z-index: 2;
    }

    /* ══════════════ BACK ══════════════ */
    .card-back {
      width: 100%; height: 100%;
      background: linear-gradient(145deg, #062006 0%, #0d350d 50%, #062006 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      position: relative;
      overflow: hidden;
    }

    .card-back::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: radial-gradient(circle, rgba(212,170,64,0.05) 1px, transparent 1px);
      background-size: 14px 14px;
    }

    .card-back::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #d4aa40, #f5d060, #d4aa40);
      z-index: 2;
    }

    .back-logo-wrap {
      position: relative; z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .back-logo-wrap img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.6));
      border-radius: 8px;
    }

    .back-tagline {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      font-weight: 500;
      color: rgba(245,208,96,0.8);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      text-align: center;
    }

    .back-rule {
      width: 50px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #d4aa40, transparent);
      margin: 4px 0;
    }

    .back-company {
      font-family: 'Cinzel', serif;
      font-size: 14px;
      font-weight: 700;
      color: #f5d060;
      letter-spacing: 0.1em;
      text-align: center;
    }

    .back-bottom-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #1a6b1a, #2e9e2e, #1a6b1a);
      z-index: 2;
    }

    /* Corner accent dots */
    .dot {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      z-index: 3;
    }
    .d-gold { background: rgba(212,170,64,0.45); }
    .d-green { background: rgba(46,158,46,0.35); }
    .tl { top: 11px; left: 11px; }
    .tr { top: 11px; right: 11px; }
    .bl { bottom: 11px; left: 11px; }
    .br { bottom: 11px; right: 11px; }
  </style>
</head>
